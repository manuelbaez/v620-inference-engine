<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qw engine dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2330; --muted: #667085; --line: #e4e7ec;
    --accent: #2f6fed; --accent2: #d9480f; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
    --bar: #e9edf3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1318; --panel: #171c23; --text: #e6e9ee; --muted: #8b95a5; --line: #262d37;
      --accent: #5b8ff9; --accent2: #f4845f; --bar: #232a34;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; padding: 16px; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  main { padding: 0 16px 24px; display: grid; gap: 16px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .v { font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  h2 { font-size: 14px; margin: 4px 0 8px; color: var(--muted); font-weight: 600; }
  .panels { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .bar { height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
  .bar > div { height: 100%; background: var(--accent); }
  .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .row .m { color: var(--muted); }
  .mem-item { margin-bottom: 10px; }
  canvas { width: 100%; height: 170px; display: block; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 4px; flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; margin-right: 5px;
                         vertical-align: middle; background: var(--c); }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .pill { padding: 1px 6px; border-radius: 8px; font-size: 12px; background: var(--bar); }
  .err { color: var(--bad); }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
</style>
</head>
<body>
<header>
  <h1>qw engine</h1>
  <span class="sub" id="model">-</span>
  <span class="sub"><span class="dot" id="dot"></span><span id="state">connecting...</span></span>
  <span class="sub" id="uptime"></span>
  <span class="sub" style="margin-left:auto">window
    <select id="win"><option value="900">15 min</option><option value="3600" selected>60 min</option><option value="300">5 min</option></select>
  </span>
</header>
<main>
  <section class="grid" id="cards"></section>

  <section class="panels">
    <div class="card"><h2>Throughput (tokens/s)</h2><canvas id="c_tps"></canvas>
      <div class="legend"><span style="--c:var(--accent)">prompt processing</span><span style="--c:var(--accent2)">generation</span></div></div>
    <div class="card"><h2>Requests</h2><canvas id="c_q"></canvas>
      <div class="legend"><span style="--c:var(--accent)">running</span><span style="--c:var(--accent2)">waiting / prefilling</span></div></div>
    <div class="card"><h2>KV cache in use (% of GPU slots)</h2><canvas id="c_kv"></canvas>
      <div class="legend"><span style="--c:var(--accent)">KV used</span></div></div>
  </section>

  <section class="panels">
    <div class="card"><h2>GPU memory</h2><div id="gpu"></div></div>
    <div class="card"><h2>Host RAM and disk</h2><div id="host"></div></div>
  </section>

  <section class="card"><h2>Recent requests</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>ended</th><th>id</th><th>finish</th><th>prompt</th><th>cached</th><th>generated</th>
        <th>queue</th><th>TTFT</th><th>total</th><th>decode</th><th>slot</th></tr></thead>
      <tbody id="reqs"></tbody>
    </table></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmtN = n => n == null ? "-" : n >= 1e9 ? (n / 1e9).toFixed(2) + " B" : n >= 1e6 ? (n / 1e6).toFixed(2) + " M"
  : n >= 1e4 ? (n / 1e3).toFixed(1) + " k" : String(Math.round(n));
const fmtB = b => b == null ? "-" : b >= 1e12 ? (b / 1e12).toFixed(2) + " TB" : b >= 1e9 ? (b / 1e9).toFixed(1) + " GB"
  : (b / 1e6).toFixed(0) + " MB";
const fmtS = s => s == null ? "-" : s < 1 ? (s * 1000).toFixed(0) + " ms" : s < 120 ? s.toFixed(2) + " s" : (s / 60).toFixed(1) + " min";
const fmtDur = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} h ${m} min` : `${m} min`; };

function card(k, v, s) { return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s || "&nbsp;"}</div></div>`; }
function bar(label, used, total, extra) {
  const pct = total ? Math.min(100, 100 * used / total) : 0;
  return `<div class="mem-item"><div class="row"><span>${label}</span><span class="m">${fmtB(used)} / ${fmtB(total)}${extra ? " · " + extra : ""}</span></div>
    <div class="bar"><div style="width:${pct.toFixed(1)}%"></div></div></div>`;
}

// line chart on a canvas: series = [{key, color}], gaps longer than 3 samples break the line
function chart(canvas, hist, series, windowS, maxHint) {
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const g = canvas.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
  const now = Date.now() / 1000, t0 = now - windowS, pts = hist.filter(p => p.t >= t0);
  let ymax = maxHint || 1;
  for (const p of pts) for (const s of series) ymax = Math.max(ymax, p[s.key] || 0);
  ymax *= 1.1;
  const L = 44, R = 8, T = 8, B = 20, pw = w - L - R, ph = h - T - B;
  g.strokeStyle = css("--line"); g.fillStyle = css("--muted"); g.font = "11px system-ui"; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = T + ph * i / 4; g.beginPath(); g.moveTo(L, y); g.lineTo(w - R, y); g.stroke();
    const val = ymax * (1 - i / 4); g.fillText(val >= 100 ? val.toFixed(0) : val.toFixed(1), 4, y + 4);
  }
  const mins = Math.round(windowS / 60);
  g.fillText(`-${mins} min`, L, h - 4); g.fillText("now", w - R - 22, h - 4);
  const X = t => L + pw * (t - t0) / windowS, Y = v => T + ph * (1 - v / ymax);
  for (const s of series) {
    g.strokeStyle = css(s.color); g.lineWidth = 1.8; g.beginPath();
    let prev = null;
    for (const p of pts) {
      const x = X(p.t), y = Y(p[s.key] || 0);
      if (prev == null || p.t - prev > 3 * 5 + 1) g.moveTo(x, y); else g.lineTo(x, y);
      prev = p.t;
    }
    g.stroke();
  }
}

let last = null;
async function refresh() {
  try {
    const r = await fetch("metrics.json", {cache: "no-store"});
    const d = await r.json(); last = d; render(d);
  } catch (e) {
    $("state").textContent = "unreachable"; $("dot").style.background = css("--bad");
  }
}

function render(d) {
  const T = d.totals, A = d.averages, Lv = d.live, M = d.memory, H = d.history;
  const cur = H.length ? H[H.length - 1] : {prompt_tps: 0, gen_tps: 0};
  const recent = Date.now() / 1000 - (H.length ? H[H.length - 1].t : 0) < 12;
  $("model").textContent = d.model;
  $("uptime").textContent = "up " + fmtDur(d.uptime_s);
  const busy = (Lv.running || 0) + (Lv.prefilling || 0) + (Lv.waiting || 0);
  $("state").textContent = busy ? `${Lv.running} running, ${Lv.prefilling} prefilling, ${Lv.waiting} waiting` : "idle";
  $("dot").style.background = busy ? css("--ok") : css("--muted");
  const hit = T.prompt_tokens ? (100 * T.cached_tokens / T.prompt_tokens).toFixed(1) + "% from cache" : "";
  $("cards").innerHTML = [
    card("Prompt processing", recent ? fmtN(cur.prompt_tps) + " tok/s" : "0 tok/s", "last 5 s"),
    card("Generation", recent ? fmtN(cur.gen_tps) + " tok/s" : "0 tok/s", "last 5 s, all requests"),
    card("Avg time to first token", fmtS(A.ttft_s), `last ${A.requests} requests`),
    card("Avg request time", fmtS(A.total_s), A.queue_s != null ? "queue " + fmtS(A.queue_s) : ""),
    card("Avg decode speed", A.decode_tps == null ? "-" : A.decode_tps + " tok/s", "per request"),
    card("Requests", fmtN(T.requests), T.errors ? `<span class="err">${T.errors} errors</span>` : "since start"),
    card("Prompt tokens", fmtN(T.prompt_tokens), hit),
    card("Prompt tokens computed", fmtN(T.computed_prompt_tokens), "prefilled on the GPUs"),
    card("Tokens generated", fmtN(T.generated_tokens), "since start"),
  ].join("");
  const win = +$("win").value;
  chart($("c_tps"), H, [{key: "prompt_tps", color: "--accent"}, {key: "gen_tps", color: "--accent2"}], win, 10);
  chart($("c_q"), H, [{key: "running", color: "--accent"}, {key: "waiting", color: "--accent2"}], win, 4);
  chart($("c_kv"), H, [{key: "kv_pct", color: "--accent"}], win, 10);

  let gpu = bar("KV cache in slots (used / allocated)", M.kv_gpu_used, M.kv_gpu_allocated,
                "slots " + M.slots.map(s => fmtN(s)).join(" / "));
  for (const c of M.gpus || [])
    gpu += bar(`${c.card} VRAM`, c.vram_used, c.vram_total, c.power_w != null ? c.power_w.toFixed(0) + " W" : "");
  $("gpu").innerHTML = gpu;
  let host = bar("Prefix cache in RAM", M.host_cache_used, M.host_cache_budget,
                 `${fmtN(M.cache_blocks)} blocks, ${fmtN(M.cache_snapshots)} snapshots`);
  host += bar("Prefix cache on disk", M.disk_cache_used, M.disk_cache_budget);
  if (M.ple_table) host += `<div class="mem-item"><div class="row"><span>PLE n-gram table (pinned)</span><span class="m">${fmtB(M.ple_table)} · ${M.ple_dir}</span></div></div>`;
  if (M.host_total) host += bar("Container RAM in use", M.host_total - M.host_available, M.host_total);
  $("host").innerHTML = host;

  $("reqs").innerHTML = d.recent.map(q => `<tr>
    <td>${new Date(q.end * 1000).toLocaleTimeString()}</td><td>${q.id}</td>
    <td><span class="pill ${q.finish === "error" || q.finish === "abort" ? "err" : ""}">${q.finish}</span></td>
    <td>${fmtN(q.prompt)}</td><td>${fmtN(q.cached)}</td><td>${fmtN(q.generated)}</td>
    <td>${fmtS(q.queue_s)}</td><td>${fmtS(q.ttft_s)}</td><td>${fmtS(q.total_s)}</td>
    <td>${q.decode_tps == null ? "-" : q.decode_tps + " tok/s"}</td><td>${q.slot}</td></tr>`).join("");
}

$("win").addEventListener("change", () => last && render(last));
window.addEventListener("resize", () => last && render(last));
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
